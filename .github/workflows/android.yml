name: android-apk

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VER: 4.7.2
  TPL_ID: 4.7.2.stable.mono

jobs:
  acceptance:
    name: 内核验收 25 条
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 跑 25 条验收（500 年 × 4 种子）
        run: dotnet run -c Release --project simcli -- 500
      - name: 长跑 1500 年（机制不能只在前 500 年成立）
        run: dotnet run -c Release --project simcli -- 1500

  build:
    needs: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 .NET 8（独立目录，避免 runner 自带的 .NET 11 抢走 SDK）
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/di.sh
          bash /tmp/di.sh --channel 8.0 --install-dir "$HOME/.dotnet8"
          echo "DOTNET_ROOT=$HOME/.dotnet8" >> "$GITHUB_ENV"
          echo "$HOME/.dotnet8" >> "$GITHUB_PATH"

      - name: 缓存 Godot 编辑器与导出模板（1.2G，必须缓存）
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates/${{ env.TPL_ID }}
          key: godot-${{ env.GODOT_VER }}-mono-v1

      - name: 下载 Godot mono 编辑器 + 模板
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VER}-stable/Godot_v${GODOT_VER}-stable_mono_linux_x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          curl -fsSL -o /tmp/tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VER}-stable/Godot_v${GODOT_VER}-stable_mono_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${TPL_ID}
          unzip -q /tmp/tpl.tpz -d /tmp/tplx
          cp -r /tmp/tplx/templates/* ~/.local/share/godot/export_templates/${TPL_ID}/

      - name: 安装 Android SDK（platform-36 / build-tools 36.1）
        run: |
          set -e
          SDK=$HOME/android-sdk
          curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p $SDK/cmdline-tools && unzip -q /tmp/clt.zip -d $SDK/cmdline-tools
          mv $SDK/cmdline-tools/cmdline-tools $SDK/cmdline-tools/latest
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK --licenses >/dev/null
          $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK "platform-tools" "platforms;android-36" "build-tools;36.1.0"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV

      - name: 安装 .NET Android workload
        run: dotnet workload install android

      - name: 准备 Android 构建模板版本标记
        run: |
          set -e
          # 模板必须取自 mono export templates，标记必须与编辑器版本一致
          mkdir -p game/android/build
          if [ ! -f game/android/build/build.gradle ]; then
            unzip -q ~/.local/share/godot/export_templates/${TPL_ID}/android_source.zip -d game/android/build
          fi
          echo "${TPL_ID}" > game/android/.build_version
          touch game/android/build/.gdignore

      - name: 构建并校验 APK
        run: |
          set -e
          export JAVA_HOME="${JAVA_HOME:-$JAVA_HOME}"
          export DOTNET_ROOT="$(dirname "$(readlink -f "$(which dotnet)")")"
          export GODOT="$HOME/godot-bin/Godot_v${GODOT_VER}-stable_mono_linux_x86_64/Godot_v${GODOT_VER}-stable_mono_linux.x86_64"
          chmod +x "$GODOT"
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then export APP_VERSION="${GITHUB_REF_NAME#v}"; else export APP_VERSION="0.6.4"; fi
          bash tools/build_apk.sh

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: xianxia-apk
          path: build/*.apk
          retention-days: 30

      # 非 tag 构建（main / 手动触发）也发一个滚动 Release，
      # 这样手机端可以直接 curl 下载，不必用 token 去拉 artifact。
      - name: 发布滚动 Release（非 tag 构建）
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建（${{ github.sha }}）
          body: |
            自动构建，来自 ${{ github.ref_name }} @ ${{ github.sha }}
            版本号见 APK 文件名；内核验收 25 条 + 1500 年长跑已通过。
          files: build/*.apk
          prerelease: true
          make_latest: false

      - name: 发布 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.apk
          generate_release_notes: true
