name: novel-app

on:
  push:
    branches: [ app/novel-engine-v1 ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novel-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle 8.7
        run: |
          set -e
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle') }}

      - name: 环境信息
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -5

      - name: 单元测试（核心引擎）
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: 构建 APK
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease

      - name: 收集产物
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/novel-engine-v0.1.0-debug.apk
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/novel-engine-v0.1.0-release-unsigned.apk
          fi
          cp app/build/outputs/apk/release/app-release.apk dist/novel-engine-v0.1.0-release.apk 2>/dev/null || true
          ls -lh dist
          sha256sum dist/* | tee dist/SHA256SUMS.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: novel-engine-apk
          path: dist/*
          retention-days: 30

      - name: 发布到本分支 Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="novel-app-v0.1.0-r${{ github.run_number }}"
          gh release create "$TAG" dist/* \
            --target "$GITHUB_REF_NAME" \
            --title "小说引擎 APK $TAG" \
            --notes "分支隔离构建：源码在 app/novel-engine-v1，不改动 main。
          本次包含：原生 Android 客户端（无 WebView）、L0–L9 引擎、G01–G12 闸门、六字段账本、四槽注入、热修台账、本地/API 双模型接入。
          安装：下载 novel-engine-v0.1.0-debug.apk 直接安装（debug 签名，仅供内测）。"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: 步骤摘要
        if: always()
        run: |
          {
            echo '## 小说引擎构建'
            echo '- 分支：`'"$GITHUB_REF_NAME"'`'
            echo '- 提交：`'"$GITHUB_SHA"'`'
            echo '- 产物：novel-engine-v0.1.0-debug.apk'
          } >> "$GITHUB_STEP_SUMMARY"
